<!DOCTYPE html>
<html>
<head>
    <title>Contact Us - The Pet Shop</title>
    <meta charset="UTF-8">
    <meta name="description" content="Get in touch with The Pet Shop for any questions, support, or inquiries. Find our store address, phone number, and contact details.">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="author" content="Jessibel Tunante Durand">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div>
            <h1>Contact Us!</h1>
        </div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>

    <!-- FORM -->
    <section>
        <div>
            <h3>Please provide your contact information and a brief message of your inquiry.</h3>
            <div>
                <form>
                    <input type="text" placeholder="First Name">
                    <input type="text" placeholder="Last Name"><br>
                    <input type="email" placeholder="Email"><br>
                    <input type="tel" placeholder="Phone Number"><br>
                    <input type="checkbox" id="Newsletter">
                    <label for="Newsletter">Would you like to receive our monthly newsletter?</label><br>
                    <textarea placeholder="Type message here..."></textarea><br>
                    <input type="submit" value="Submit">
                </form>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <table>
            <tr>
                <td>
                    <p>The Pet Shop! &copy;</p>
                </td>
                <td>
                    <p>123 Square Ave</p>
                    <p>Portland, OR 97204</p>
                </td>
                <td>
                    <p>503-234-3966</p>
                </td>
            </tr>
        </table>
    </footer>
</body>
</html>
