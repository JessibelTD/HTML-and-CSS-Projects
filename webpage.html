	<h1>Remembrance Day</h1>
	<p>Remembrance Day is observed on November 11 to honour those who served and sacrificed in wars and conflicts.</p>
	<p>At 11 a.m., people pause for a moment of silence to remember them.</p>
	<p>The red poppy is a symbol of remembrance and hope for peace.</p>
